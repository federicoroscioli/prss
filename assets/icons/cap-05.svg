<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Intelligenza Artificiale">

  <!-- Neural network nodes -->
  <!-- Input layer (left) -->
  <circle cx="12" cy="20" r="4" fill="#c0392b"/>
  <circle cx="12" cy="32" r="4" fill="#c0392b"/>
  <circle cx="12" cy="44" r="4" fill="#c0392b"/>
  <!-- Hidden layer (center) -->
  <circle cx="32" cy="14" r="4.5" fill="#c0392b" opacity=".8"/>
  <circle cx="32" cy="26" r="4.5" fill="#c0392b"/>
  <circle cx="32" cy="38" r="4.5" fill="#c0392b"/>
  <circle cx="32" cy="50" r="4.5" fill="#c0392b" opacity=".8"/>
  <!-- Output node (right) -->
  <circle cx="52" cy="32" r="5.5" fill="#c0392b"/>
  <!-- Connections input→hidden -->
  <line x1="16" y1="20" x2="28" y2="14" stroke="#e8a89e" stroke-width="1.3"/>
  <line x1="16" y1="20" x2="28" y2="26" stroke="#e8a89e" stroke-width="1.3"/>
  <line x1="16" y1="32" x2="28" y2="26" stroke="#e8a89e" stroke-width="1.3"/>
  <line x1="16" y1="32" x2="28" y2="38" stroke="#e8a89e" stroke-width="1.3"/>
  <line x1="16" y1="44" x2="28" y2="38" stroke="#e8a89e" stroke-width="1.3"/>
  <line x1="16" y1="44" x2="28" y2="50" stroke="#e8a89e" stroke-width="1.3"/>
  <line x1="16" y1="20" x2="28" y2="38" stroke="#e8a89e" stroke-width=".8" opacity=".4"/>
  <line x1="16" y1="44" x2="28" y2="26" stroke="#e8a89e" stroke-width=".8" opacity=".4"/>
  <!-- Connections hidden→output -->
  <line x1="36" y1="14" x2="47" y2="32" stroke="#e8a89e" stroke-width="1.3"/>
  <line x1="36" y1="26" x2="47" y2="32" stroke="#e8a89e" stroke-width="1.3"/>
  <line x1="36" y1="38" x2="47" y2="32" stroke="#e8a89e" stroke-width="1.3"/>
  <line x1="36" y1="50" x2="47" y2="32" stroke="#e8a89e" stroke-width="1.3"/>

</svg>