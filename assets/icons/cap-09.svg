<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Giustizia: Riforma Strutturale">

  <!-- Gavel head -->
  <rect x="18" y="12" width="28" height="14" rx="3" fill="#277a3f"/>
  <!-- Gavel detail (center band) -->
  <rect x="22" y="14" width="4" height="10" rx="1" fill="white" opacity=".4"/>
  <rect x="38" y="14" width="4" height="10" rx="1" fill="white" opacity=".4"/>
  <!-- Handle -->
  <path d="M32 26 L44 44" stroke="#277a3f" stroke-width="5" stroke-linecap="round"/>
  <!-- Motion lines -->
  <line x1="20" y1="38" x2="28" y2="32" stroke="#277a3f" stroke-width="1.5"
        stroke-linecap="round" opacity=".4"/>
  <line x1="18" y1="44" x2="26" y2="38" stroke="#277a3f" stroke-width="1.5"
        stroke-linecap="round" opacity=".4"/>
  <!-- Sound block -->
  <rect x="10" y="48" width="28" height="6" rx="2" fill="#277a3f" opacity=".2"
        stroke="#277a3f" stroke-width="1.5"/>
  <!-- Circle accent -->
  <circle cx="46" cy="48" r="6" fill="#277a3f" opacity=".15" stroke="#277a3f" stroke-width="1.5"/>
  <path d="M43 48 Q46 44 49 48" stroke="#277a3f" stroke-width="1.5"
        stroke-linecap="round" fill="none"/>

</svg>