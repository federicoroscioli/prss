<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Istruzione, Ricerca, Sanità">

  <!-- Open book -->
  <!-- Left page -->
  <path d="M8 16 Q8 10 14 10 L32 14 L32 54 L14 50 Q8 50 8 44 Z"
        fill="#aacde6" stroke="#1a6fa8" stroke-width="2"/>
  <!-- Right page -->
  <path d="M56 16 Q56 10 50 10 L32 14 L32 54 L50 50 Q56 50 56 44 Z"
        fill="#1a6fa8" opacity=".1" stroke="#1a6fa8" stroke-width="2"/>
  <!-- Book spine / center -->
  <line x1="32" y1="14" x2="32" y2="54" stroke="#1a6fa8" stroke-width="2.5"/>
  <!-- Lines on left page -->
  <line x1="14" y1="24" x2="28" y2="25" stroke="#1a6fa8" stroke-width="1.3" opacity=".5"/>
  <line x1="14" y1="30" x2="28" y2="31" stroke="#1a6fa8" stroke-width="1.3" opacity=".5"/>
  <line x1="14" y1="36" x2="28" y2="37" stroke="#1a6fa8" stroke-width="1.3" opacity=".5"/>
  <!-- Medical cross on right page -->
  <rect x="40" y="26" width="8" height="18" rx="2" fill="#1a6fa8" opacity=".7"/>
  <rect x="36" y="30" width="16" height="10" rx="2" fill="#1a6fa8" opacity=".7"/>
  <rect x="40" y="26" width="8" height="18" rx="2" fill="white" opacity=".4"/>
  <rect x="36" y="30" width="16" height="10" rx="2" fill="white" opacity=".4"/>

</svg>