<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Politica Estera e Ruolo nell'UE">

  <!-- Globe base circles -->
  <circle cx="32" cy="32" r="22" stroke="#c0392b" stroke-width="2" fill="#f5f0e8" opacity=".7"/>
  <!-- Latitude lines -->
  <ellipse cx="32" cy="32" rx="22" ry="8" stroke="#c0392b" stroke-width="1.3"
           fill="none" opacity=".4"/>
  <!-- Longitude line -->
  <ellipse cx="32" cy="32" rx="12" ry="22" stroke="#c0392b" stroke-width="1.3"
           fill="none" opacity=".4"/>
  <!-- Equator -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#c0392b" stroke-width="1.3" opacity=".4"/>
  <!-- EU stars (simplified: 6 dots in a partial arc) -->
  <circle cx="32" cy="12" r="2.5" fill="#c0392b"/>
  <circle cx="22" cy="16" r="2.5" fill="#c0392b"/>
  <circle cx="16" cy="26" r="2.5" fill="#c0392b"/>
  <circle cx="16" cy="38" r="2.5" fill="#c0392b"/>
  <circle cx="22" cy="48" r="2.5" fill="#c0392b"/>
  <circle cx="32" cy="52" r="2.5" fill="#c0392b"/>
  <circle cx="42" cy="48" r="2.5" fill="#c0392b"/>
  <circle cx="48" cy="38" r="2.5" fill="#c0392b"/>
  <circle cx="48" cy="26" r="2.5" fill="#c0392b"/>
  <circle cx="42" cy="16" r="2.5" fill="#c0392b"/>

</svg>