<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Piano Decennale: Coperture e Investimenti">

  <!-- Timeline base line -->
  <line x1="8" y1="48" x2="56" y2="48" stroke="#277a3f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arrow at end -->
  <path d="M54 44 L60 48 L54 52" stroke="#277a3f" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Three milestone markers (phases 1-2-3) -->
  <!-- Phase 1 -->
  <line x1="18" y1="38" x2="18" y2="48" stroke="#277a3f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18" cy="36" r="5" fill="#277a3f"/>
  <text x="18" y="40" text-anchor="middle" font-size="6" fill="white" font-family="sans-serif"
        font-weight="bold">1</text>
  <!-- Phase 2 -->
  <line x1="32" y1="30" x2="32" y2="48" stroke="#277a3f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="28" r="5.5" fill="#277a3f"/>
  <text x="32" y="32" text-anchor="middle" font-size="6" fill="white" font-family="sans-serif"
        font-weight="bold">2</text>
  <!-- Phase 3 -->
  <line x1="46" y1="20" x2="46" y2="48" stroke="#277a3f" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="18" r="6" fill="#277a3f"/>
  <text x="46" y="22" text-anchor="middle" font-size="6" fill="white" font-family="sans-serif"
        font-weight="bold">3</text>
  <!-- Upward trend dots -->
  <circle cx="8" cy="50" r="2" fill="#277a3f" opacity=".4"/>
  <!-- Year labels -->
  <text x="18" y="58" text-anchor="middle" font-size="7" fill="#277a3f"
        font-family="sans-serif" opacity=".7">2029</text>
  <text x="32" y="58" text-anchor="middle" font-size="7" fill="#277a3f"
        font-family="sans-serif" opacity=".7">2033</text>
  <text x="46" y="58" text-anchor="middle" font-size="7" fill="#277a3f"
        font-family="sans-serif" opacity=".7">2037</text>

</svg>