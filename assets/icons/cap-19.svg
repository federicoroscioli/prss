<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Previdenza: Sostenibilità, Equità, Flessibilità">

  <!-- Hourglass body -->
  <path d="M16 8 L48 8 L36 32 L48 56 L16 56 L28 32 Z"
        fill="#1a6fa8" opacity=".12" stroke="#1a6fa8" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Top half fill (sand) -->
  <path d="M18 10 L46 10 L35 30 Z" fill="#1a6fa8" opacity=".5"/>
  <!-- Bottom half fill (sand fallen) -->
  <path d="M28 34 L46 54 L18 54 Z" fill="#1a6fa8"/>
  <!-- Center pinch line -->
  <line x1="28" y1="32" x2="36" y2="32" stroke="#1a6fa8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sand flowing (thin line center) -->
  <line x1="32" y1="32" x2="32" y2="38" stroke="white" stroke-width="1.5"
        stroke-linecap="round" opacity=".7"/>
  <!-- Top cap bar -->
  <rect x="14" y="7" width="36" height="4" rx="2" fill="#1a6fa8"/>
  <!-- Bottom cap bar -->
  <rect x="14" y="53" width="36" height="4" rx="2" fill="#1a6fa8"/>

</svg>