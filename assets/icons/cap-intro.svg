<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Oltre la crescita">

  <!-- Three bars: GDP measurement -->
  <rect x="7" y="44" width="11" height="14" rx="1.5" fill="#1a6fa8"/>
  <rect x="22" y="36" width="11" height="22" rx="1.5" fill="#c0392b"/>
  <rect x="37" y="40" width="11" height="18" rx="1.5" fill="#277a3f" opacity=".35"/>
  <!-- Plant stem growing from third bar -->
  <path d="M42.5 40 L42.5 22" stroke="#277a3f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left leaf -->
  <path d="M42.5 32 C38 27 37 19 40 15 C44 19 44 28 42.5 32Z" fill="#277a3f"/>
  <!-- Right leaf -->
  <path d="M42.5 27 C47 22 50 14 47 10 C43 14 41 22 42.5 27Z" fill="#277a3f" opacity=".65"/>
  <!-- Ground baseline -->
  <line x1="5" y1="58" x2="59" y2="58" stroke="#1c1c2e" stroke-width="1.5"
        stroke-linecap="round" opacity=".18"/>

</svg>