<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Nota Metodologica">

  <!-- Open book (left page) -->
  <path d="M8 18 Q8 12 14 12 L32 16 L32 52 L14 48 Q8 48 8 42 Z"
        fill="#e8a89e" opacity=".3" stroke="#c0392b" stroke-width="2"/>
  <!-- Right page -->
  <path d="M56 18 Q56 12 50 12 L32 16 L32 52 L50 48 Q56 48 56 42 Z"
        fill="#c0392b" opacity=".08" stroke="#c0392b" stroke-width="2"/>
  <!-- Spine -->
  <line x1="32" y1="16" x2="32" y2="52" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Lines on left page -->
  <line x1="14" y1="24" x2="28" y2="25" stroke="#c0392b" stroke-width="1.3" opacity=".5"/>
  <line x1="14" y1="30" x2="28" y2="31" stroke="#c0392b" stroke-width="1.3" opacity=".5"/>
  <line x1="14" y1="36" x2="28" y2="37" stroke="#c0392b" stroke-width="1.3" opacity=".5"/>
  <!-- Magnifying glass on right page -->
  <circle cx="44" cy="34" r="8.5" fill="white" stroke="#c0392b" stroke-width="2.2"/>
  <line x1="50" y1="40" x2="55" y2="46" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Question mark or detail inside glass -->
  <circle cx="44" cy="30" r="2" fill="#c0392b" opacity=".6"/>
  <line x1="44" y1="33" x2="44" y2="37" stroke="#c0392b" stroke-width="2" stroke-linecap="round" opacity=".6"/>

</svg>